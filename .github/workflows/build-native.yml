name: Build native plugin

on:
  push:
    branches: [main, develop]
    paths:
      - "native/**"
      - ".gitmodules"
      - ".github/workflows/build-native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".gitmodules"
      - ".github/workflows/build-native.yml"
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open a PR that updates the binaries in brt-unity-package
        type: boolean
        default: true

concurrency:
  # Keep manual runs separate so a push doesn't cancel a binaries-update run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # Matches the NDK bundled with Unity 6000.3 (r27c).
  ANDROID_NDK_VERSION: 27.2.12479018
  # rapidobj uses aligned_alloc, which bionic only declares from API 28.
  ANDROID_PLATFORM: android-28

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S native -B native/build-ci
          -G Xcode
          -DBUILD_DESKTOP_HOST=OFF

      - name: Build
        run: cmake --build native/build-ci --config ${{ env.BUILD_TYPE }} --parallel

      - name: Ad-hoc sign bundle
        run: codesign --force --deep --sign - brt-unity-package/Runtime/Plugins/osx/AudioPluginBRTUnity.bundle

      - name: Verify bundle
        run: |
          BIN=brt-unity-package/Runtime/Plugins/osx/AudioPluginBRTUnity.bundle/Contents/MacOS/AudioPluginBRTUnity
          lipo -info "$BIN"
          for arch in x86_64 arm64; do lipo "$BIN" -verify_arch "$arch"; done
          codesign --verify --deep --strict brt-unity-package/Runtime/Plugins/osx/AudioPluginBRTUnity.bundle

      # Zip with ditto so the .bundle folder, executable bit and signature survive
      # (upload-artifact does not preserve file permissions). Exclude extended
      # attributes so no AppleDouble ._* files end up in the archive.
      - name: Package bundle
        run: |
          ditto -c -k --norsrc --noextattr --noqtn --keepParent \
            brt-unity-package/Runtime/Plugins/osx/AudioPluginBRTUnity.bundle \
            AudioPluginBRTUnity-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AudioPluginBRTUnity-macos
          path: AudioPluginBRTUnity-macos.zip
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S native -B native/build-ci
          -A x64
          -DBUILD_DESKTOP_HOST=OFF

      - name: Build
        run: cmake --build native/build-ci --config ${{ env.BUILD_TYPE }} --parallel

      - name: Verify DLL
        shell: bash
        run: test -f brt-unity-package/Runtime/Plugins/x86_64/AudioPluginBRTUnity.dll

      - uses: actions/upload-artifact@v4
        with:
          name: AudioPluginBRTUnity-windows-x86_64
          path: brt-unity-package/Runtime/Plugins/x86_64/AudioPluginBRTUnity.dll
          if-no-files-found: error

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          echo "NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S native -B native/build-ci
          -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build native/build-ci --parallel

      - name: Verify .so
        run: |
          SO=brt-unity-package/Runtime/Plugins/Android/arm64-v8a/libAudioPluginBRTUnity.so
          BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          file "$SO"
          "$BIN/llvm-readelf" -d "$SO" | grep NEEDED
          "$BIN/llvm-nm" -D --defined-only "$SO" | grep UnityGetAudioEffectDefinitions
          # Google Play requires 16 KB-aligned LOAD segments (Android 15+).
          for align in $("$BIN/llvm-readelf" -lW "$SO" | awk '$1 == "LOAD" { print $NF }'); do
            echo "LOAD align $align"
            if (( align < 0x4000 )); then echo "::error::LOAD segment not 16 KB aligned"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AudioPluginBRTUnity-android-arm64-v8a
          path: brt-unity-package/Runtime/Plugins/Android/arm64-v8a/libAudioPluginBRTUnity.so
          if-no-files-found: error

  ios:
    name: iOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S native -B native/build-ci
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build native/build-ci --parallel

      - name: Verify static library
        run: |
          LIB=brt-unity-package/Runtime/Plugins/iOS/libAudioPluginBRTUnity.a
          lipo -info "$LIB"
          lipo "$LIB" -verify_arch arm64
          nm "$LIB" 2>/dev/null | grep ' T _UnityGetAudioEffectDefinitions'

      - uses: actions/upload-artifact@v4
        with:
          name: AudioPluginBRTUnity-ios-arm64
          path: brt-unity-package/Runtime/Plugins/iOS/libAudioPluginBRTUnity.a
          if-no-files-found: error

  update-package:
    name: Open PR with updated binaries
    if: github.event_name == 'workflow_dispatch' && inputs.open_pr
    needs: [macos, windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Copy binaries into package
        env:
          ART: ${{ runner.temp }}/artifacts
          PLUGINS: brt-unity-package/Runtime/Plugins
        run: |
          # macOS: replace the whole bundle (its .meta lives next to it and is kept)
          rm -rf "$PLUGINS/osx/AudioPluginBRTUnity.bundle"
          unzip -q "$ART/AudioPluginBRTUnity-macos/AudioPluginBRTUnity-macos.zip" -d "$PLUGINS/osx"

          cp "$ART/AudioPluginBRTUnity-windows-x86_64/AudioPluginBRTUnity.dll" "$PLUGINS/x86_64/"

          cp "$ART/AudioPluginBRTUnity-android-arm64-v8a/libAudioPluginBRTUnity.so" "$PLUGINS/Android/arm64-v8a/"
          chmod +x "$PLUGINS/Android/arm64-v8a/libAudioPluginBRTUnity.so"  # tracked as 100755

          cp "$ART/AudioPluginBRTUnity-ios-arm64/libAudioPluginBRTUnity.a" "$PLUGINS/iOS/"

          git status --short
          # Only binaries should change; .meta files must stay untouched.
          if git status --porcelain | grep '\.meta$'; then
            echo "::error::.meta files changed"; exit 1
          fi

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/update-plugin-binaries
          base: ${{ github.ref_name }}
          add-paths: brt-unity-package/Runtime/Plugins
          commit-message: |
            chore: update native plugin binaries

            Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            from ${{ github.sha }}.
          title: Update native plugin binaries (${{ github.ref_name }})
          body: |
            Native plugin binaries rebuilt by CI from ${{ github.sha }} ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            | Platform | File |
            |---|---|
            | macOS (universal) | `osx/AudioPluginBRTUnity.bundle` |
            | Windows (x86_64) | `x86_64/AudioPluginBRTUnity.dll` |
            | Android (arm64-v8a) | `Android/arm64-v8a/libAudioPluginBRTUnity.so` |
            | iOS (arm64) | `iOS/libAudioPluginBRTUnity.a` |

            Test in Unity before merging. Re-running the workflow updates this PR.
          delete-branch: true
